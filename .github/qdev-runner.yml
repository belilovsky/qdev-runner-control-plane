schema_version: qdev-runner-v2
execution_mode: github-hosted-primary
self_hosted_recovery: true
# Self-hosted profiles are permitted only in these manual recovery workflows.
recovery_workflows:
  - runner-smoke.yml
# Hosted checks remain primary. This repository may use the recovery lane only
# with a terminal full run and a signed, enforced receipt bound to every tuple.
recovery_ci_alternative:
  enabled: true
  receipt_schema: qdev-controller-receipt-v2
  enforcement: enforced
  requires_exact_binding: true
profiles:
  - qdev-ci
trusted_events:
  - push
  - workflow_dispatch
  - pull_request_internal
resources:
  cpu: 1
  memory_mb: 3072
  disk_mb: 12288
artifact_policy: qdev-artifact-v1
release_runner: null
