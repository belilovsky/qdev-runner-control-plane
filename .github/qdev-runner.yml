schema_version: qdev-runner-v2
execution_mode: github-hosted-primary
self_hosted_recovery: true
# Self-hosted capacity is reserved for the explicit manual recovery workflow.
recovery_workflows:
  - runner-smoke.yml
# This manual bootstrap lane may retain a sealed recovery artifact only after
# its source and image scans pass; the normal QDev artifact store remains primary.
github_artifact_recovery_workflows:
  - controller-recovery-build.yml
profiles:
  - qdev-ci
trusted_events:
  - push
  - workflow_dispatch
  - pull_request_internal
resources:
  cpu: 1
  memory_mb: 3072
  disk_mb: 4096
artifact_policy: qdev-artifact-v1
release_runner: null
