schema_version: qdev-runner-v3
execution_mode: controller-managed-self-hosted
github_hosted_fallback: false
# Every self-hosted workflow is admitted by the controller against the exact
# repository, run, job, attempt, SHA, event, ref, profile and unique job label.
profiles:
  - qdev-ci
trusted_events:
  - push
  - workflow_dispatch
  - pull_request_internal
resources:
  cpu: 1
  memory_mb: 3072
  disk_mb: 12288
artifact_policy: qdev-artifact-v1
release_runner: null
