schema_version: qdev-runner-v2
execution_mode: github-hosted-primary
self_hosted_recovery: true
# Normal verification runs on the provider-hosted lane. The sole self-hosted
# workflow is an owner-dispatched, exact-SHA controller recovery job.
profiles:
  - qdev-ci
trusted_events:
  - push
  - workflow_dispatch
  - pull_request_internal
resources:
  cpu: 1
  memory_mb: 3072
  disk_mb: 12288
artifact_policy: qdev-artifact-v1
release_runner: null
recovery_workflows:
  - runner-smoke.yml
