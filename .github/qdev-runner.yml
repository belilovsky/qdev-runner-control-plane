schema_version: qdev-runner-v1
# Owner-authorized migration of equivalent checks from billing-blocked hosted
# compute to the existing centralized pool; no dynamic or hosted fallback.
github_hosted_fallback: false
profiles:
  - qdev-ci
trusted_events:
  - push
  - workflow_dispatch
  - pull_request_internal
resources:
  cpu: 1
  memory_mb: 3072
  disk_mb: 12288
artifact_policy: qdev-artifact-v1
release_runner: null
