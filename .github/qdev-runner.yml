schema_version: qdev-runner-v2
execution_mode: github-hosted-primary
self_hosted_recovery: true
# The recovery job remains manual-only. Existing controller capacity is the
# bounded primary lane while provider-hosted jobs are unavailable; both normal
# workflows require exact, controller-issued per-job labels.
recovery_workflows:
  - runner-smoke.yml
primary_self_hosted_workflows:
  - ci.yml
  - qdev-runner-contract.yml
profiles:
  - qdev-ci
trusted_events:
  - push
  - workflow_dispatch
  - pull_request_internal
resources:
  cpu: 1
  memory_mb: 3072
  disk_mb: 12288
artifact_policy: qdev-artifact-v1
release_runner: null
