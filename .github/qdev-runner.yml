schema_version: qdev-runner-v3
execution_mode: controller-managed-self-hosted
github_hosted_fallback: false
# All repository jobs, including the manually dispatched bootstrap lanes, use
# the enrolled QDev pool. Recovery artifact upload is allowed only on its exact
# owner-dispatched workflow and remains bounded by the seven-day retention.
github_artifact_recovery_workflows:
  - controller-recovery-build.yml
profiles:
  - qdev-ci
  - qdev-ci-docker
trusted_events:
  - push
  - workflow_dispatch
  - pull_request_internal
resources:
  cpu: 1
  memory_mb: 3072
  disk_mb: 4096
artifact_policy: qdev-artifact-v1
release_runner: null
