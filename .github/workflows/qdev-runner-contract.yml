name: QDev runner contract

on:
  pull_request:
    paths:
      - ".github/**"
      - "AGENTS.md"
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qdev-runner-contract:
    name: qdev-runner-contract
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Validate QDev runner contract
        run: python3 .github/scripts/qdev-runner-policy.py --root .
