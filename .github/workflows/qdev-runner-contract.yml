name: QDev runner contract

on:
  # This policy is a required admission check for every internal PR.  A
  # source-only change can alter the runner contract just as easily as a
  # workflow edit, so path filtering would leave the required context absent.
  pull_request:
  push:
    branches:
      - main
    paths:
      - ".github/**"
      - "AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qdev-runner-contract:
    name: qdev-runner-contract
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Validate QDev runner contract
        run: python3 .github/scripts/qdev-runner-policy.py --root .
