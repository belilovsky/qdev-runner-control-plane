name: QDev runner smoke

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact 40-character source SHA to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  runner-smoke:
    name: runner-smoke
    runs-on:
      - self-hosted
      - Linux
      - X64
      - qdev-ci
      - qdev-job-${{ github.run_id }}-${{ github.run_attempt }}-recovery
    timeout-minutes: 30
    env:
      CANDIDATE_SHA: ${{ inputs.candidate_sha }}
    steps:
      - name: Verify recovery runner contract
        shell: bash
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT}" = "self-hosted"
          test -n "${RUNNER_NAME}"
          if [[ ! "${CANDIDATE_SHA}" =~ ^[0-9a-f]{40}$ ]]; then
            echo "candidate_sha must be a lowercase 40-character commit SHA" >&2
            exit 1
          fi
          test ! -S /var/run/docker.sock
      - name: Checkout candidate source
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.candidate_sha }}
          persist-credentials: false
      - name: Verify exact candidate checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "${CANDIDATE_SHA}"
          printf 'recovery_source repo=%s sha=%s runner=%s\n' \
            "${GITHUB_REPOSITORY}" "${CANDIDATE_SHA}" "${RUNNER_NAME}"
      - name: Set up Python 3.12
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install verification dependencies
        shell: bash
        run: python -m pip install -e '.[dev]'
      - name: Run full repository verification
        shell: bash
        run: bash .github/scripts/verify-full.sh
      - name: Bind immutable source bundle
        shell: bash
        run: |
          set -euo pipefail
          bundle_digest="$(git archive --format=tar "${CANDIDATE_SHA}" | sha256sum | awk '{print $1}')"
          printf 'recovery_artifact source_sha=%s bundle_sha256=%s\n' \
            "${CANDIDATE_SHA}" "${bundle_digest}"
