name: QDev controller manual verification

on:
  workflow_dispatch:
    inputs:
      execution_lane:
        type: choice
        options: [hosted, recovery]
        default: hosted
        required: true
        description: Explicit execution lane; no automatic fallback
      expected_sha:
        type: string
        required: true
        description: Exact SHA of the selected workflow ref
      owner_recovery:
        type: boolean
        default: false
        description: Owner confirms controller-signed FIFO recovery for this run

permissions:
  contents: read

concurrency:
  group: controller-manual-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-hosted:
    if: github.event_name == 'workflow_dispatch' && inputs.execution_lane == 'hosted'
    name: verify-hosted
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Full controller verification
        env:
          QDEV_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: python scripts/verify_controller_ci.py --lane hosted
  runner-smoke:
    if: github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/') && inputs.execution_lane == 'recovery' && inputs.owner_recovery && github.repository_owner != '' && github.actor == github.repository_owner
    name: runner-smoke
    runs-on:
      - self-hosted
      - Linux
      - X64
      - qdev-ci
      - qdev-job-${{ github.run_id }}-${{ github.run_attempt }}-smoke
    timeout-minutes: 30
    steps:
      - name: Verify ephemeral runner contract
        shell: bash
        env:
          QDEV_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          set -euo pipefail
          test "${RUNNER_ENVIRONMENT}" = "self-hosted"
          test -n "${RUNNER_NAME}"
          test -n "${GITHUB_SHA}"
          [[ "${GITHUB_REF}" == refs/heads/* && "${GITHUB_REF}" != refs/heads/ ]]
          [[ "${QDEV_EXPECTED_SHA}" =~ ^[0-9a-f]{40}$ ]]
          test "${GITHUB_SHA}" = "${QDEV_EXPECTED_SHA}"
          test ! -S /var/run/docker.sock
          printf 'runner_smoke_ok repo=%s sha=%s runner=%s\n' \
            "${GITHUB_REPOSITORY}" "${GITHUB_SHA}" "${RUNNER_NAME}"
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - name: Full controller verification
        env:
          QDEV_EXPECTED_SHA: ${{ inputs.expected_sha }}
          QDEV_OWNER_RECOVERY: ${{ inputs.owner_recovery }}
        run: python scripts/verify_controller_ci.py --lane controller-recovery
