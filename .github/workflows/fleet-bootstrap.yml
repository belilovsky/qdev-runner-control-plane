name: Fleet bootstrap validation

on:
  workflow_dispatch:
    inputs:
      action:
        description: "Allowlisted bootstrap action"
        required: true
        type: choice
        options:
          - activate-controller
          - enrol-host-agent
          - restore-existing-worker
      controller_revision:
        description: "Exact pushed controller source SHA; activation/enrolment only"
        required: false
        type: string
      controller_release_digest:
        description: "Exact immutable controller release bundle digest; activation/enrolment only"
        required: false
        type: string
      controller_image_digest:
        description: "Exact immutable controller image digest; activation/enrolment only"
        required: false
        type: string
      controller_internal_image_digest:
        description: Exact internal controller OCI image digest (defaults to public for legacy releases)
        required: false
        type: string
      activation_envelope_digest:
        description: "Digest of the externally signed activation envelope"
        required: false
        type: string
      release_lane:
        description: "Required only for enrol-host-agent"
        required: false
        type: string
      worker_name:
        description: "Required only for restore-existing-worker"
        required: false
        type: string
      idempotency_key:
        description: "One-time operation key (8-128 characters)"
        required: true
        type: string
      claim_ttl_seconds:
        description: "Short-lived claim TTL, up to the policy maximum"
        required: true
        default: "900"
        type: string

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: fleet-bootstrap-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: fleet-bootstrap-validate
    runs-on:
      - self-hosted
      - Linux
      - X64
      - qdev-ci
      - qdev-job-${{ github.run_id }}-${{ github.run_attempt }}-fleet-bootstrap-validate
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install validation dependencies
        run: python -m pip install -e '.[dev]'
      - name: Validate signed bootstrap request
        env:
          BOOTSTRAP_ACTION: ${{ inputs.action }}
          BOOTSTRAP_CONTROLLER_REVISION: ${{ inputs.controller_revision }}
          BOOTSTRAP_CONTROLLER_RELEASE_DIGEST: ${{ inputs.controller_release_digest }}
          BOOTSTRAP_CONTROLLER_IMAGE_DIGEST: ${{ inputs.controller_image_digest }}
          BOOTSTRAP_CONTROLLER_INTERNAL_IMAGE_DIGEST: ${{ inputs.controller_internal_image_digest }}
          BOOTSTRAP_ACTIVATION_ENVELOPE_DIGEST: ${{ inputs.activation_envelope_digest }}
          BOOTSTRAP_RELEASE_LANE: ${{ inputs.release_lane }}
          BOOTSTRAP_WORKER_NAME: ${{ inputs.worker_name }}
          BOOTSTRAP_IDEMPOTENCY_KEY: ${{ inputs.idempotency_key }}
          BOOTSTRAP_CLAIM_TTL_SECONDS: ${{ inputs.claim_ttl_seconds }}
          BOOTSTRAP_JOB_NAME: fleet-bootstrap-validate
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
        run: python scripts/fleet_bootstrap_validate.py
