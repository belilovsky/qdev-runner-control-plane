name: Controller recovery build

on:
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Exact main commit authorized for recovery
        required: true
        type: string

permissions:
  contents: read

concurrency:
  # Keep recovery builds serialized on the enrolled Docker-capable pool.
  group: controller-recovery-build-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  controller-recovery-build:
    if: >-
      github.actor == github.repository_owner &&
      github.ref == 'refs/heads/main' && inputs.expected_sha == github.sha
    # Owner-dispatched controller recovery uses the existing Docker-capable
    # QDev worker and never falls back to a paid GitHub-hosted runner.
    runs-on:
      - self-hosted
      - Linux
      - X64
      - qdev-ci-docker
      - qdev-job-${{ github.run_id }}-${{ github.run_attempt }}-recovery-build
    permissions:
      contents: read
      id-token: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: |
          # Keep generated packaging metadata out of the signed release tree.
          # Local installs can create ignored *.egg-info files in the checkout,
          # so remove that exact generated directory before fingerprinting.
          # The release guard deliberately rejects group-writable trusted Python
          # modules.  The wheel build can preserve group-write bits even with a
          # safe umask, so harden only the installed trusted package before the
          # guard exercises it.  Its content and ownership checks remain intact.
          umask 022
          python -m pip install '.[dev]'
          python - <<'PY'
          from pathlib import Path
          import qdev_runner

          package_root = Path(qdev_runner.__file__).resolve().parent
          if package_root.is_symlink() or not package_root.is_dir():
              raise SystemExit("installed qdev_runner package is not a real directory")
          for installed_file in package_root.rglob("*"):
              if installed_file.is_symlink():
                  raise SystemExit(f"unexpected symlink in trusted package: {installed_file}")
              if installed_file.is_file():
                  installed_file.chmod(installed_file.stat().st_mode & ~0o022)
          PY
          rm -rf -- src/qdev_runner_control_plane.egg-info
          rm -rf -- build
          git restore --worktree .
          test -z "$(find src -maxdepth 1 -type d -name '*.egg-info' -print -quit)"
          test -z "$(git status --porcelain)"
          bash scripts/install_controller_scan_tools.sh
      - name: Verify complete controller suite on the recovery lane
        env:
          QDEV_EXPECTED_SHA: ${{ inputs.expected_sha }}
          QDEV_OWNER_RECOVERY: "true"
        run: python scripts/verify_controller_ci.py --lane controller-recovery-build
      - name: Build and scan exact recovery image
        env:
          QDEV_EXPECTED_SHA: ${{ inputs.expected_sha }}
        run: |
          test "$(git rev-parse HEAD)" = "$QDEV_EXPECTED_SHA"
          python scripts/controller_recovery_artifact.py build \
            --release-root . --output "$RUNNER_TEMP/controller-recovery-build" \
            --confirm-non-production-build-host
      - name: Retain sealed recovery material in GitHub
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: controller-recovery-${{ github.sha }}
          path: ${{ runner.temp }}/controller-recovery-build
          if-no-files-found: error
          retention-days: 7
      - name: Record controller reconciliation handoff
        run: |
          cd "$RUNNER_TEMP"
          bash "$GITHUB_WORKSPACE/templates/qdev-upload-artifact.sh" \
            controller-recovery-build controller-recovery-build
