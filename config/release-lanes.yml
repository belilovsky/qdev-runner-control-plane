schema_version: qdev-release-lanes-v2
lanes:
  qdev-release-qaz-tours:
    project_id: qaz-tours
    placement: vps-hostinger-186
    # Caddy injects these identities only after it validates the corresponding
    # client certificate against the controller CA; clients cannot self-assert
    # either header through the public edge.
    client_mtls_identity: qdev-release-client:qaz-tours
    host_agent_mtls_identity: qdev-host-agent:vps-hostinger-186
    # Product capacity is independent from shared CI capacity.  It reserves
    # enough room for current, verified rollback and atomic candidate release.
    minimum_free_gib: 60
    heartbeat_ttl_seconds: 90
    artifact_repository: qaz-tours
    canonical_repository: belilovsky/qaz-tours
    artifact_ref_prefix: registry.ci.qdev.run/qaz-tours
    native_host_adapter: legacy-qaz-tours-v1
    runtime_endpoints: [https://qaza.tours/.well-known/release.json]
    rollback_reference: qdev-release-host-state-v1
    required_readiness: [qazgeo]
  qdev-release-qaz-fund:
    project_id: qaz-fund
    placement: vps-apps-148
    # These identity names are only an allowlist. The controller accepts them
    # solely after the existing CA validates the enrolled client certificate.
    client_mtls_identity: qdev-release-client:qaz-fund
    host_agent_mtls_identity: qdev-host-agent:vps-apps-148
    minimum_free_gib: 20
    heartbeat_ttl_seconds: 90
    artifact_repository: qaz-fund
    canonical_repository: belilovsky/qaz-fund
    artifact_ref_prefix: registry.ci.qdev.run/qaz-fund
    native_host_adapter: legacy-compose-v1
    runtime_endpoints: [https://qaz.fund/.well-known/release.json]
    rollback_reference: qdev-release-host-state-v1
    required_readiness: [local, public]
  qdev-release-qaz-events:
    project_id: qaz-events
    placement: vps-main
    client_mtls_identity: qdev-release-client:qaz-events
    host_agent_mtls_identity: qdev-host-agent:vps-main
    minimum_free_gib: 20
    heartbeat_ttl_seconds: 90
    artifact_repository: qaz-events
    canonical_repository: belilovsky/qaz-events
    artifact_ref_prefix: registry.ci.qdev.run/qaz-events
    native_host_adapter: legacy-compose-v1
    runtime_endpoints: [https://qaz.events/.well-known/qdev-ecosystem.json]
    rollback_reference: qdev-release-host-state-v1
    required_readiness: [local, public]
  qdev-release-qmt:
    project_id: kaztilshi
    placement: srv138jump
    # These names are allowlists only. The edge derives them from a certificate
    # validated by the existing QDev CA; no caller-supplied header is trusted.
    client_mtls_identity: qdev-release-client:kaztilshi
    host_agent_mtls_identity: qdev-host-agent:srv138jump
    # Controller admission only. The root-owned native adapter calculates the
    # exact candidate + retained rollback + 2 GiB requirement on the host.
    minimum_free_gib: 1
    heartbeat_ttl_seconds: 90
    artifact_repository: kaztilshi
    canonical_repository: belilovsky/kazakh-translate
    artifact_ref_prefix: registry.ci.qdev.run/kaztilshi
    native_host_adapter: qmt-native-release-v1
    runtime_endpoints: [https://qmt.digital/api/health, https://qmt.digital/api/readiness, https://qmt.digital/release.json]
    rollback_reference: qdev-release-host-state-v1
    required_readiness: [native, public, identity]
  qdev-release-qazpolit:
    project_id: qazpolit
    placement: srv138jump
    # QazPolit shares the host with QMT, but not its release lane. Every
    # dispatch endpoint is bound to this lane before a host agent receives it.
    client_mtls_identity: qdev-release-client:qazpolit
    host_agent_mtls_identity: qdev-host-agent:srv138jump
    # The native adapter measures candidate, retained rollback and the fixed
    # two-GiB reserve before it touches the application runtime.
    minimum_free_gib: 1
    heartbeat_ttl_seconds: 90
    artifact_repository: qazpolit
    canonical_repository: belilovsky/qazpolit
    artifact_ref_prefix: registry.ci.qdev.run/qazpolit
    native_host_adapter: qazpolit-native-release-v1
    runtime_endpoints: [https://qazpolit.com/api/runtime]
    rollback_reference: qdev-release-host-state-v1
    required_readiness: [native, public, identity]
  qdev-release-ortcom:
    project_id: ortcom
    placement: ortcom-production-controller
    client_mtls_identity: qdev-release-client:ortcom
    host_agent_mtls_identity: qdev-host-agent:ortcom-production-controller
    minimum_free_gib: 20
    heartbeat_ttl_seconds: 90
    artifact_repository: ortcom-kz
    canonical_repository: belilovsky/ortcom-kz
    artifact_ref_prefix: ghcr.io/belilovsky/ortcom-kz
    native_host_adapter: ortcom-root-deploy-v1
    runtime_endpoints: [https://ortcom.qdev.run/health, "https://ortcom.qdev.run/api/ready?deep=1", https://ortcom.qdev.run/release.json]
    rollback_reference: deploy/ortcom-deploy transactional rollback
    required_readiness: [native, public, identity]
  qdev-release-cmnt:
    project_id: cmnt
    placement: cmnt-rolling-controller
    client_mtls_identity: qdev-release-client:cmnt
    host_agent_mtls_identity: qdev-host-agent:cmnt-rolling-controller
    minimum_free_gib: 12
    heartbeat_ttl_seconds: 90
    artifact_repository: cmnt-web-admin
    canonical_repository: belilovsky/cmnt-web
    artifact_ref_prefix: ci.qdev.run/artifacts/cmnt-web-admin
    native_host_adapter: cmnt-root-rolling-launcher-v1
    runtime_endpoints: [https://cmnt.qdev.run/health]
    rollback_reference: scripts/deploy_forward_only.sh native rollback receipt
    required_readiness: [native, public, identity]
  qdev-release-total:
    project_id: total-kz
    placement: total-qdev-origin
    client_mtls_identity: qdev-release-client:total-kz
    host_agent_mtls_identity: qdev-host-agent:total-qdev-origin
    minimum_free_gib: 30
    heartbeat_ttl_seconds: 90
    artifact_repository: total-kz-admin
    canonical_repository: belilovsky/total-kz
    artifact_ref_prefix: ci.qdev.run/artifacts/total-kz-admin
    native_host_adapter: total-qdev-native-release-v1
    runtime_endpoints: [https://total.qdev.run/health, https://total.qdev.run/ready, https://total.qdev.run/release.json]
    rollback_reference: deploy/total-kz/rollback-total-public.sh
    required_readiness: [native, public, identity]
  qdev-release-qazposter:
    project_id: qazposter
    placement: qazposter-production-controller
    client_mtls_identity: qdev-release-client:qazposter
    host_agent_mtls_identity: qdev-host-agent:qazposter-production-controller
    minimum_free_gib: 12
    heartbeat_ttl_seconds: 90
    artifact_repository: qazposter-admin
    canonical_repository: belilovsky/qazposter
    artifact_ref_prefix: ci.qdev.run/artifacts/qazposter-admin
    native_host_adapter: qazposter-native-release-v1
    runtime_endpoints: [https://qpost.pro/health, https://qpost.pro/api/v1/integration-contract]
    rollback_reference: immutable previous-binary rollback contract
    required_readiness: [native, public, identity]
  qdev-release-qazgeo:
    project_id: qazgeo
    # Logical application-runtime placement. Admission remains fail-closed
    # until the controller receives a fresh mTLS heartbeat from an enrolled
    # application host proving the exact active and rollback tuples.
    placement: qazgeo-app-runtime
    client_mtls_identity: qdev-release-client:qazgeo
    host_agent_mtls_identity: qdev-host-agent:qazgeo-app-runtime
    minimum_free_gib: 20
    heartbeat_ttl_seconds: 90
    artifact_repository: belilovsky/qazgeo
    canonical_repository: belilovsky/qazgeo
    artifact_ref_prefix: registry.ci.qdev.run/belilovsky/qazgeo
    native_host_adapter: qazgeo-native-immutable-release-v1
    runtime_endpoints:
      - https://qgeo.tech/health
      - https://qgeo.tech/health/live
      - https://qgeo.tech/health/ready
      - https://qgeo.tech/health/quality
    rollback_reference: controller-verified immutable runtime d65cd62a4c96786d9d5c35ebea8af872dcc3cb69 rollback receipt
    required_readiness: [db, postgis, martin, photon, redis, app]
  qdev-release-qazagents-static:
    project_id: qazagents
    # This is a logical placement only.  The root-owned private enrolment
    # registry must map this exact target to a host adapter before admission;
    # without that mapping enrolment returns access_blocked/target_unregistered.
    placement: qazagents-static-runtime
    client_mtls_identity: qdev-release-client:qazagents-static
    host_agent_mtls_identity: qdev-host-agent:qazagents-static-runtime
    minimum_free_gib: 4
    heartbeat_ttl_seconds: 90
    artifact_repository: qazagents-static
    canonical_repository: belilovsky/qazagents
    artifact_ref_prefix: registry.ci.qdev.run/qazagents-static
    native_host_adapter: qazagents-static-release-v1
    runtime_endpoints:
      - https://qazagents.qdev.run/health.json
      - https://qazagents.qdev.run/readiness.json
      - https://qazagents.qdev.run/release.json
      - https://qazagents.qdev.run/skills/index.json
    rollback_reference: controller-verified immutable QazAgents static rollback receipt
    required_readiness: [native, public, identity]
