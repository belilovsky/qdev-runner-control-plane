schema_version: qdev-release-lanes-v1
lanes:
  qdev-release-qaz-tours:
    project_id: qaz-tours
    placement: vps-hostinger-186
    # Caddy injects these identities only after it validates the corresponding
    # client certificate against the controller CA; clients cannot self-assert
    # either header through the public edge.
    client_mtls_identity: qdev-release-client:qaz-tours
    host_agent_mtls_identity: qdev-host-agent:vps-hostinger-186
    # Product capacity is independent from shared CI capacity.  It reserves
    # enough room for current, verified rollback and atomic candidate release.
    minimum_free_gib: 60
    heartbeat_ttl_seconds: 90
    artifact_repository: qaz-tours
  qdev-release-qaz-fund:
    project_id: qaz-fund
    placement: vps-apps-148
    # These identity names are only an allowlist. The controller accepts them
    # solely after the existing CA validates the enrolled client certificate.
    client_mtls_identity: qdev-release-client:qaz-fund
    host_agent_mtls_identity: qdev-host-agent:vps-apps-148
    minimum_free_gib: 20
    heartbeat_ttl_seconds: 90
    artifact_repository: qaz-fund
  qdev-release-qaz-events:
    project_id: qaz-events
    placement: vps-main
    client_mtls_identity: qdev-release-client:qaz-events
    host_agent_mtls_identity: qdev-host-agent:vps-main
    minimum_free_gib: 20
    heartbeat_ttl_seconds: 90
    artifact_repository: qaz-events
  qdev-release-qmt:
    project_id: kaztilshi
    placement: srv138jump
    # These names are allowlists only. The edge derives them from a certificate
    # validated by the existing QDev CA; no caller-supplied header is trusted.
    client_mtls_identity: qdev-release-client:kaztilshi
    host_agent_mtls_identity: qdev-host-agent:srv138jump
    minimum_free_gib: 20
    heartbeat_ttl_seconds: 90
    artifact_repository: kaztilshi
  qdev-release-qazgeo:
    project_id: qazgeo
    # Verified QGeo application host behind the qgeo.tech edge (187.55.228.239).
    placement: qazgeo-primary-187
    client_mtls_identity: qdev-release-client:qazgeo
    host_agent_mtls_identity: qdev-host-agent:qazgeo-primary-187
    minimum_free_gib: 20
    heartbeat_ttl_seconds: 90
    artifact_repository: belilovsky/qazgeo
