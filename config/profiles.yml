schema_version: qdev-runner-profiles-v1
profiles:
  qdev-ci:
    labels: [self-hosted, Linux, X64, qdev-ci]
    # Lightweight lint and analysis only. The worker's independent free-space
    # floor remains in force; this allocation permits dispatch without
    # admitting Docker builds.
    resources: {cpu: 1.0, memory_mb: 3072, disk_mb: 10240, pids_limit: 512}
    timeout_minutes: 45
    # Public repositories may run trusted same-repository PR branches. The
    # broker still rejects every cross-repository/fork PR by repository ID.
    allow_public_pr: true
  qdev-ci-browser:
    labels: [self-hosted, Linux, X64, qdev-ci-browser]
    resources: {cpu: 2.0, memory_mb: 4096, disk_mb: 15360, pids_limit: 768}
    timeout_minutes: 60
    allow_public_pr: true
  qdev-ci-docker:
    labels: [self-hosted, Linux, X64, qdev-ci-docker]
    resources: {cpu: 2.0, memory_mb: 5120, disk_mb: 20480, pids_limit: 1024}
    timeout_minutes: 90
    allow_public_pr: true
