schema_version: qdev-runner-profiles-v1
# QazShield's pinned release-image workflow has a measured bounded build scope.
# This changes admission for that exact repository/profile only; the worker's
# live disk floor remains enforced throughout execution.
repository_admission_disk_mb:
  # The controller recovery build uses the already-cached 2.11 GiB runner
  # image and a 24 MiB checked-out source tree.  The build is the only
  # bootstrap path for restoring a controller with constrained capacity, so
  # reserve the policy minimum of 4 GiB for this exact Docker lane while the
  # worker's independent 4.5 GiB free-space floor remains mandatory.
  belilovsky/qdev-runner-control-plane:
    qdev-ci-docker: 4096
  belilovsky/qazshield:
    qdev-ci-docker: 15360
  # QazLake declares a 12 GiB bounded compose-validation workload in its
  # canonical runner manifest. Reserve that measured scope only; the worker's
  # independent free-space floor is still enforced before the job is claimed.
  belilovsky/qazlake:
    qdev-ci-docker: 12288
  # QazCompute's pinned Docker release produced 824 MiB of compressed layers,
  # while its workflow independently requires 20 GiB of free host space before
  # building.  Reserve 18 GiB for admission on this repository only; the
  # controller's 4.5 GiB hard floor and the workflow preflight remain intact.
  belilovsky/qazcompute:
    qdev-ci-docker: 18432
  # MCP Servers uses this lane for isolated registry access while its current
  # workflow runs bounded Python service checks rather than an OCI build. Its
  # successful exact-SHA history completes without a Docker-layer expansion,
  # so keep the documented 12 GiB repository minimum while preserving the
  # worker's independent hard free-space floor.
  belilovsky/mcp-servers:
    qdev-ci-docker: 12288
  # Adilet Digest Studio declares a 12 GiB bounded Docker verification scope
  # in its exact-SHA runner manifest.  Reserve that source-owned minimum for
  # admission only; the worker's independent 4 GiB free-space floor still
  # applies throughout execution and the default Docker profile stays 20 GiB
  # for every other repository.
  belilovsky/adilet-digest-studio:
    qdev-ci-docker: 12288
  # QGeo's recovery image is a small 142 MiB compressed runtime on the
  # production target; its qdev-ci-docker lane runs the pinned dependency and
  # PostGIS checks before publishing one immutable image. Reserve 15 GiB for
  # this repository only, in addition to the dedicated 20 GiB production and
  # rollback reserve: QGeo admission therefore requires at least 35 GiB free.
  # The worker's independent running floor and workflow preflight remain active.
  belilovsky/qazgeo:
    qdev-ci-docker: 15360
  # The current FIFO head for id-qdev-run is its static-contract validation:
  # it invokes Docker Compose configuration validation but does not build or
  # retain an OCI image.  Its successful executions on mail-qdev-reserve were
  # short-lived, with no persistent Docker volumes.  Reserve the supported
  # 12 GiB minimum for this repository/profile only; the controller's 4.5 GiB
  # independent live free-space floor remains mandatory.
  belilovsky/id-qdev-run:
    qdev-ci-docker: 12288
  # Qaz.Vision's measured checkout is 120 MiB (53 MiB tracked source) and
  # its published runtime image is 201 MiB. Its Docker lane builds one slim
  # Python image, with no nested services or persistent Docker volumes.
  # Reserve 8 GiB for that measured workload. The worker's independent
  # 4.5 GiB hard free-space floor and workflow preflight remain enforced.
  belilovsky/tokaev-module:
    qdev-ci-docker: 8192
  # QazPolit declares a 12 GiB exact-SHA Docker release lane. Keep this
  # repository-specific admission bound below the profile default while the
  # worker's independent hard floor remains enforced during execution.
  belilovsky/qazpolit:
    qdev-ci-docker: 12288
repository_admission_constraints:
  # QGeo production and rollback bytes retain 20 GiB independently of the
  # 15 GiB exact build reservation above. This absolute server-side floor is
  # not reducible by a capacity override, and the ephemeral worker may execute
  # only one exact provider job at a time.
  belilovsky/qazgeo:
    min_disk_free_gib: 35
    max_concurrency: 1
profiles:
  qdev-ci:
    labels: [self-hosted, Linux, X64, qdev-ci]
    # qdev-ci is the dependency-light contract/test lane. Image builds and
    # browser runtimes use their separately sized profiles below. The measured
    # queue head and AVDS foundation candidate each require under 1 GiB, so a
    # 4 GiB reservation keeps more than 4x headroom while the worker's
    # independent 4.5 GiB running floor remains enforced.
    resources: {cpu: 1.0, memory_mb: 3072, disk_mb: 4096, pids_limit: 512}
    timeout_minutes: 45
    # Public repositories may run trusted same-repository PR branches. The
    # broker still rejects every cross-repository/fork PR by repository ID.
    allow_public_pr: true
    # A successful execution receipt remains incomplete until the controller
    # has persisted both its JUnit result and Cobertura coverage source.
    required_test_report_formats: [junit, cobertura]
  qdev-ci-browser:
    labels: [self-hosted, Linux, X64, qdev-ci-browser]
    # The pinned browser runner image is 1.35 GiB.  A 5 GiB job reservation
    # leaves its separately enforced worker free-space floor intact while
    # allowing this profile to run on the measured recovery capacity.
    resources: {cpu: 2.0, memory_mb: 4096, disk_mb: 5120, pids_limit: 768}
    timeout_minutes: 60
    allow_public_pr: true
  qdev-ci-docker:
    labels: [self-hosted, Linux, X64, qdev-ci-docker]
    resources: {cpu: 2.0, memory_mb: 5120, disk_mb: 20480, pids_limit: 1024}
    timeout_minutes: 90
    allow_public_pr: true
