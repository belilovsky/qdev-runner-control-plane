schema_version: qdev-runner-profiles-v1
# QazShield's pinned release-image workflow has a measured bounded build scope.
# This changes admission for that exact repository/profile only; the worker's
# live disk floor remains enforced throughout execution.
repository_admission_disk_mb:
  # QDEV's static-contracts lane validates shell, Python/JSON and Compose
  # configuration without building or publishing an OCI image.  Its pinned
  # workflow has a ten-minute bound and installs only small contract tools, so
  # reserve 4 GiB for this repository while retaining the worker's independent
  # 4.5 GiB hard free-space floor.  The default Docker profile remains 20 GiB.
  belilovsky/id-qdev-run:
    qdev-ci-docker: 4096
  # QDEV's qdev-ci lane only checks its runner contract and environment.
  # The ~20.4 MiB checkout has no build or package-install workload here.
  # 4 GiB conservatively covers checkout and the pinned Actions/Python setup
  # for this dependency-free check. Its separate browser lane and the worker's
  # independent 4.5 GiB running floor remain unchanged.
  belilovsky/qdev-run-site:
    qdev-ci: 4096
  belilovsky/qazshield:
    qdev-ci-docker: 15360
  # QazLake declares a 12 GiB bounded compose-validation workload in its
  # canonical runner manifest. Reserve that measured scope only; the worker's
  # independent free-space floor is still enforced before the job is claimed.
  belilovsky/qazlake:
    qdev-ci-docker: 12288
  # QazCompute's pinned Docker release produced 824 MiB of compressed layers,
  # while its workflow independently requires 20 GiB of free host space before
  # building.  Reserve 18 GiB for admission on this repository only; the
  # controller's 4.5 GiB hard floor and the workflow preflight remain intact.
  belilovsky/qazcompute:
    qdev-ci-docker: 18432
  # MCP Servers uses this lane for isolated registry access while its current
  # workflow runs bounded Python service checks rather than an OCI build. Its
  # successful exact-SHA history completes without a Docker-layer expansion,
  # so keep the documented 12 GiB repository minimum while preserving the
  # worker's independent hard free-space floor.
  belilovsky/mcp-servers:
    qdev-ci-docker: 12288
  # Adilet Digest Studio declares a 12 GiB bounded Docker verification scope
  # in its exact-SHA runner manifest.  Reserve that source-owned minimum for
  # admission only; the worker's independent 4 GiB free-space floor still
  # applies throughout execution and the default Docker profile stays 20 GiB
  # for every other repository.
  belilovsky/adilet-digest-studio:
    qdev-ci-docker: 12288
  # QGeo's exact candidate has 176 MiB of tracked source, a 290 MiB local test
  # environment and a 142 MiB production image. Its qdev-ci-docker lane adds
  # one pinned PostGIS service before publishing one immutable image. Reserve
  # 4 GiB (over 6.7x the measured 608 MiB inputs) for this repository only;
  # the worker's independent 4.5 GiB free-space floor remains enforced before
  # selection and throughout execution.
  belilovsky/qazgeo:
    qdev-ci-docker: 4096
  # Qaz.Vision's release image has a measured 201 MiB compressed runtime and
  # its candidate checkout is 331 MiB. Its Docker lane is a single slim
  # Python image build with no nested services; reserve the supported 12 GiB
  # repository minimum after that measurement. The worker's independent
  # 4.5 GiB hard free-space floor and workflow preflight remain enforced.
  belilovsky/tokaev-module:
    qdev-ci-docker: 12288
  # QazPolit declares a 12 GiB exact-SHA Docker release lane. Keep this
  # repository-specific admission bound below the profile default while the
  # worker's independent hard floor remains enforced during execution.
  belilovsky/qazpolit:
    qdev-ci-docker: 12288
profiles:
  qdev-ci:
    labels: [self-hosted, Linux, X64, qdev-ci]
    resources: {cpu: 1.0, memory_mb: 3072, disk_mb: 12288, pids_limit: 512}
    timeout_minutes: 45
    # Public repositories may run trusted same-repository PR branches. The
    # broker still rejects every cross-repository/fork PR by repository ID.
    allow_public_pr: true
  qdev-ci-browser:
    labels: [self-hosted, Linux, X64, qdev-ci-browser]
    # The pinned browser runner image is 1.35 GiB.  A 5 GiB job reservation
    # leaves its separately enforced worker free-space floor intact while
    # allowing this profile to run on the measured recovery capacity.
    resources: {cpu: 2.0, memory_mb: 4096, disk_mb: 5120, pids_limit: 768}
    timeout_minutes: 60
    allow_public_pr: true
  qdev-ci-docker:
    labels: [self-hosted, Linux, X64, qdev-ci-docker]
    resources: {cpu: 2.0, memory_mb: 5120, disk_mb: 20480, pids_limit: 1024}
    timeout_minutes: 90
    allow_public_pr: true
