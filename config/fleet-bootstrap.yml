schema_version: qdev-fleet-bootstrap-policy-v1
bootstrap:
  repository: belilovsky/qdev-runner-control-plane
  branch: main
  workflow: .github/workflows/fleet-bootstrap.yml
  audience: qdev-fleet-bootstrap-v1
  max_claim_ttl_seconds: 900
activation:
  controller_revision: d3341e9f0d900d7dc023dfb2e95efd45ef45d8cd
  controller_release_digest: sha256:14c5a8b506947c18c55646e36bfec077885a63a8a272b5aea1112d31266e969f
  rollback_revision: 13a165e43b6dd61a3cbbb60ca487bb7edab10f37
  rollback_release_digest: sha256:2d3ded47b00a5d5e01d94f6df40b4744482c51c2bc2ed6fe264b2d50914f9981
enrolment:
  lanes:
    - qdev-release-qmt
    - qdev-release-qazgeo
workers:
  - qdev-ci
  - qdev-ci-browser
  - qdev-ci-docker
worker_targets:
  # These are existing, controller-registered service identities. The
  # controller resolves host_binding through its private registry; no
  # workflow may supply a hostname or a new runner identity.
  - worker_name: qdev-platform-ci-187
    target_id: actions.runner.belilovsky-platform-portal.qdev-platform-ci-187
    service_unit: actions.runner.belilovsky-platform-portal.qdev-platform-ci-187.service
    host_binding: controller-registry
    labels: [self-hosted, Linux, X64, qdev-platform-ci]
  - worker_name: qdev-qazstack-01
    target_id: actions.runner.belilovsky-qazstack.qdev-qazstack-01
    service_unit: actions.runner.belilovsky-qazstack.qdev-qazstack-01.service
    host_binding: controller-registry
    labels: [self-hosted, Linux, X64, qdev-ci]
