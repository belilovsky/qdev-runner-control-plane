schema_version: qdev-fleet-bootstrap-policy-v1
bootstrap:
  repository: belilovsky/qdev-runner-control-plane
  branch: main
  workflow: .github/workflows/fleet-bootstrap.yml
  audience: qdev-fleet-bootstrap-v1
  max_claim_ttl_seconds: 900
activation:
  # The signed workflow request binds revision to its own OIDC source SHA.
  # The controller derives the image reference from this fixed repository and
  # the exact digest carried by the signed release request. This avoids a
  # circular future-commit SHA in the policy source.
  source_revision_binding: workflow-source
  artifact_ref_prefix: registry.ci.qdev.run/qdev-runner-control-plane
  rollback_revision: 0a3f418bc45375f431481b60470cdf8bee218eae
  rollback_release_digest: sha256:570e44d17fb99c927fffef2cc429fd411c2a3240ab9d7e15bc7c9065f8c2834e
enrolment:
  lanes:
    - qdev-release-qmt
workers:
  - qdev-ci
  - qdev-ci-browser
  - qdev-ci-docker
worker_targets:
  # These are existing, controller-registered service identities. The
  # controller resolves host_binding through its private registry; no
  # workflow may supply a hostname or a new runner identity.
  - worker_name: srv1879763-primary
    target_id: controller.worker.srv1879763-primary
    service_unit: qdev-runner-worker.service
    host_binding: controller-registry
    labels: [self-hosted, Linux, X64, qdev-ci, qdev-ci-browser, qdev-ci-docker]
    certificate_fingerprint_sha256: ed0a503d98a2c163c42b3244f5b4f83c88b7b3ab4a7e028482c890ab814650f3
