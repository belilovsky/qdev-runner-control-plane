schema_version: qdev-fleet-bootstrap-policy-v2
bootstrap:
  repository: belilovsky/qdev-runner-control-plane
  branch: main
  workflow: .github/workflows/fleet-bootstrap.yml
  audience: qdev-fleet-bootstrap-v1
  max_claim_ttl_seconds: 900
activation:
  mode: signed-external-envelope
  envelope_schema: qdev-controller-activation-envelope-v1
  public_key_binding: controller-registry
  max_envelope_ttl_seconds: 1800
enrolment:
  lanes:
    - qdev-release-ortcom
    - qdev-release-cmnt
    - qdev-release-total
    - qdev-release-qazposter
    - qdev-release-qmt
    - qdev-release-qazgeo
    - qdev-release-qazagents-static
workers:
  - qdev-ci
  - qdev-ci-browser
  - qdev-ci-docker
worker_targets:
  # These are existing, controller-registered service identities. The
  # controller resolves host_binding through its private registry; no
  # workflow may supply a hostname or a new runner identity.
  - worker_name: qdev-platform-ci-187
    target_id: actions.runner.belilovsky-platform-portal.qdev-platform-ci-187
    service_unit: actions.runner.belilovsky-platform-portal.qdev-platform-ci-187.service
    host_binding: controller-registry
    labels: [self-hosted, Linux, X64, qdev-platform-ci]
  - worker_name: qdev-qazstack-01
    target_id: actions.runner.belilovsky-qazstack.qdev-qazstack-01
    service_unit: actions.runner.belilovsky-qazstack.qdev-qazstack-01.service
    host_binding: controller-registry
    labels: [self-hosted, Linux, X64, qdev-ci]
  # This is the one controller-registered queue worker.  Its recovery adapter
  # repairs only stale controller-owned position overlays; it never creates a
  # runner identity or accepts a hostname from a workflow request.
  - worker_name: srv1879763-primary
    target_id: qdev-ci.srv1879763-primary
    service_unit: qdev-runner-worker.service
    host_binding: controller-registry
    labels: [self-hosted, Linux, X64, qdev-ci, qdev-ci-browser, qdev-ci-docker]
capacity_topology:
  schema: qdev-ci-four-vps-capacity-v1
  minimum_safe_slots: 6
  minimum_docker_hosts: 2
  reserve_hosts: [mail-general-reserve]
  hosts:
    - host_id: srv1879763-primary
      role: primary
      worker_name: srv1879763-primary
      worker_tier: primary
      slots: 2
      profiles: [qdev-ci, qdev-ci-browser, qdev-ci-docker]
      max_docker_jobs: 1
    - host_id: srv1626458-build
      role: build
      # This is a physical capacity target, not a claimed runner identity.
      # The worker name is filled only by the controller's private registry
      # after a signed host audit and GitHub registration reconciliation.
      worker_name: null
      worker_tier: primary
      slots: 2
      profiles: [qdev-ci, qdev-ci-browser, qdev-ci-docker]
      max_docker_jobs: 1
    - host_id: srv138jump-general
      role: general
      worker_name: null
      worker_tier: primary
      slots: 2
      profiles: [qdev-ci, qdev-ci-browser]
      max_docker_jobs: 0
    - host_id: mail-general-reserve
      role: reserve
      worker_name: null
      worker_tier: reserve
      slots: 2
      profiles: [qdev-ci, qdev-ci-browser]
      max_docker_jobs: 0
