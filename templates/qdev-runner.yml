schema_version: qdev-runner-v2
execution_mode: github-hosted-primary
self_hosted_recovery: true
# Self-hosted profiles are permitted only in these manual recovery workflows.
recovery_workflows:
  - runner-smoke.yml
profiles:
  - qdev-ci
trusted_events:
  - push
  - workflow_dispatch
  - schedule
  - pull_request_internal
resources:
  cpu: 1
  memory_mb: 3072
  disk_mb: 12288
artifact_policy: qdev-artifact-v1
release_runner: null
# Protected deploy/release workflows that may use ghcr.io for immutable
# product images. Keep CI, cache, and evidence workflows out of this list.
release_registry_workflows: []
