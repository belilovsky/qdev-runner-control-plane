schema_version: qdev-runner-v2
execution_mode: self-hosted-primary
self_hosted_recovery: false
# Test and verification workflows run only on the enrolled self-hosted pool.
# There is deliberately no hosted fallback: capacity failures remain visible.
profiles:
  - qdev-ci
trusted_events:
  - push
  - workflow_dispatch
  - schedule
  - pull_request_internal
resources:
  cpu: 1
  memory_mb: 3072
  disk_mb: 12288
artifact_policy: qdev-artifact-v1
release_runner: null
# Protected deploy/release workflows that may use ghcr.io for immutable
# product images. Keep CI, cache, and evidence workflows out of this list.
release_registry_workflows: []
