[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "qdev-runner-control-plane"
version = "0.1.0"
description = "Ephemeral self-hosted GitHub Actions runner broker for the qdev portfolio"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=45,<47",
  "defusedxml>=0.7.1,<1",
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.11,<3",
  "PyYAML>=6.0.2,<7",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "coverage>=7.10,<8",
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "ruff>=0.12,<1",
  "types-PyYAML>=6.0.12,<7",
]

[project.scripts]
qdev-runner-broker = "qdev_runner.broker:main"
qdev-controller-admission = "qdev_runner.controller_admission:main"
qdev-runner-operator = "qdev_runner.operator:main"
qdev-runner-worker = "qdev_runner.worker:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["S603", "S607"]
"tests/*.py" = ["S106"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["qdev_runner"]
