name: qdev-runner

services:
  broker-public:
    container_name: qdev-runner-broker-public
    build:
      context: ..
      dockerfile: deploy/Dockerfile.broker
    restart: unless-stopped
    env_file: /etc/qdev-runner/broker.env
    environment:
      PORT: "9020"
      QDEV_LISTEN_HOST: "0.0.0.0"
      QDEV_BROKER_SURFACE: public
      # The public process never receives operator/release authority from the
      # shared env file.  Application routing also rejects every /internal/*
      # path, so a forged edge identity header cannot cross this boundary.
      QDEV_OPERATOR_TOKEN: ""
      QDEV_OPERATOR_RECEIPT_KEY: ""
      QDEV_OPERATOR_DIRECTIVE_KEY: ""
      QDEV_RELEASE_CLAIM_KEY: ""
      QDEV_WORKER_TOKEN: ""
      QDEV_GITHUB_APP_ID: ""
      QDEV_GITHUB_APP_PRIVATE_KEY: /nonexistent/qdev-github-app.pem
      QDEV_REGISTRY_PASSWORD: ""
      QDEV_RELEASE_HOST_DISPATCH_KEYS_FILE: /nonexistent/qdev-release-host-dispatch-keys.json
      # Only the queue database, artifact upload tree and non-secret controller
      # release status are shared with the internal broker. Controller journals,
      # release jobs and signing receipts stay outside the public mount namespace.
      QDEV_DATABASE: /var/lib/qdev-runner/broker-state/broker.db
      QDEV_CLAIM_SCOPES: /nonexistent/claim-scopes.json
      QDEV_ARTIFACT_ROOT: /var/lib/qdev-runner/artifacts
      QDEV_CONTROLLER_RELEASE_STATUS: /var/lib/qdev-runner/controller-status/controller-release.json
    volumes:
      - /etc/qdev-runner/repos.json:/etc/qdev-runner/repos.json:ro
      - /etc/qdev-runner/profiles.yml:/etc/qdev-runner/profiles.yml:ro
      - /var/lib/qdev-runner/broker-state:/var/lib/qdev-runner/broker-state
      - /var/lib/qdev-runner/artifacts:/var/lib/qdev-runner/artifacts
      - /var/lib/qdev-runner/controller-status:/var/lib/qdev-runner/controller-status:ro
    networks:
      - qdev_edge
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  broker-internal:
    container_name: qdev-runner-broker-internal
    build:
      context: ..
      dockerfile: deploy/Dockerfile.broker
    restart: unless-stopped
    env_file: /etc/qdev-runner/broker.env
    environment:
      PORT: "9443"
      QDEV_LISTEN_HOST: "0.0.0.0"
      QDEV_BROKER_SURFACE: internal
      QDEV_GITHUB_WEBHOOK_SECRET: ""
      # Public and edge-mediated controller endpoints share one durable scope
      # store.  Client mTLS terminates at the source-owned edge; this broker is
      # never published on a host port and is reachable only on the internal
      # Docker network.
      QDEV_DATABASE: /var/lib/qdev-runner/broker-state/broker.db
      QDEV_CLAIM_SCOPES: /var/lib/qdev-runner/control-state/claim-scopes.json
      QDEV_ADMIN_PLATFORM_RECEIPT_ROOT: /var/lib/qdev-runner/admin-platform-receipts
      # The operator uses the externally authenticated edge.  It must not
      # acquire a direct path around worker certificate verification.
      QDEV_CONTROLLER_URL: https://worker.ci.qdev.run
      QDEV_OPERATOR_MTLS_CA: /etc/qdev-runner/mtls/operator/ca.pem
      QDEV_OPERATOR_MTLS_CERT: /etc/qdev-runner/mtls/operator/operator-cert.pem
      QDEV_OPERATOR_MTLS_KEY: /etc/qdev-runner/mtls/operator/operator-key.pem
      QDEV_FLEET_BOOTSTRAP_POLICY: /etc/qdev-runner/fleet-bootstrap.yml
      QDEV_FLEET_BOOTSTRAP_OPERATION_ROOT: /var/lib/qdev-runner/operations/fleet-bootstrap
      QDEV_FLEET_BOOTSTRAP_RECEIPT_ROOT: /var/lib/qdev-runner/operations/fleet-bootstrap-receipts
      # This is the broker's entire host-mutation boundary: an unprivileged
      # immutable request spool and a read-only durable result spool.  Host
      # adapters and the Docker socket are never mounted into the container.
      QDEV_FLEET_HOST_DISPATCH_REQUEST_ROOT: /var/lib/qdev-runner/fleet-host-dispatch/incoming
      QDEV_FLEET_HOST_DISPATCH_RESULT_ROOT: /var/lib/qdev-runner/fleet-host-dispatch/results
      QDEV_RELEASE_HOST_DISPATCH_KEYS_FILE: /etc/qdev-runner/release-host-dispatch-keys.json
      QDEV_RELEASE_HOST_DISPATCH_CLAIM_TTL_SECONDS: "120"
      QDEV_RELEASE_JOB_LEASE_TTL_SECONDS: "3600"
      QDEV_GITHUB_APP_PRIVATE_KEY: /etc/qdev-runner/github-app.pem
      # Directory mounts preserve visibility when these files are replaced
      # atomically; a single-file bind would pin the old inode.
      QDEV_CONTROLLER_RELEASE_STATUS: /var/lib/qdev-runner/controller-status/controller-release.json
      QDEV_ADMIN_PLATFORM_LEDGER: /var/lib/qdev-runner/admin-platform-state/admin-platform-ledger.yml
    volumes:
      - /etc/qdev-runner/repos.json:/etc/qdev-runner/repos.json:ro
      - /etc/qdev-runner/profiles.yml:/etc/qdev-runner/profiles.yml:ro
      - /etc/qdev-runner/release-lanes.yml:/etc/qdev-runner/release-lanes.yml:ro
      - /etc/qdev-runner/managed-registry.yml:/etc/qdev-runner/managed-registry.yml:ro
      - /etc/qdev-runner/managed-release-ledger.yml:/etc/qdev-runner/managed-release-ledger.yml:ro
      - /etc/qdev-runner/fleet-bootstrap.yml:/etc/qdev-runner/fleet-bootstrap.yml:ro
      - /etc/qdev-runner/release-host-dispatch-keys.json:/etc/qdev-runner/release-host-dispatch-keys.json:ro
      - /etc/qdev-runner/github-app.pem:/etc/qdev-runner/github-app.pem:ro
      - /etc/qdev-runner/mtls/operator:/etc/qdev-runner/mtls/operator:ro
      - /var/lib/qdev-runner/broker-state:/var/lib/qdev-runner/broker-state
      - /var/lib/qdev-runner/control-state:/var/lib/qdev-runner/control-state
      - /var/lib/qdev-runner/artifacts:/var/lib/qdev-runner/artifacts
      - /var/lib/qdev-runner/operations:/var/lib/qdev-runner/operations
      - /var/lib/qdev-runner/admin-platform-receipts:/var/lib/qdev-runner/admin-platform-receipts
      - /var/lib/qdev-runner/controller-status:/var/lib/qdev-runner/controller-status:ro
      - /var/lib/qdev-runner/admin-platform-state:/var/lib/qdev-runner/admin-platform-state:ro
      - /var/lib/qdev-runner/release-jobs:/var/lib/qdev-runner/release-jobs
      - /var/lib/qdev-runner/fleet-host-dispatch/incoming:/var/lib/qdev-runner/fleet-host-dispatch/incoming
      - /var/lib/qdev-runner/fleet-host-dispatch/results:/var/lib/qdev-runner/fleet-host-dispatch/results:ro
    networks:
      - qdev_runner_internal
      # The broker accepts no host-published traffic, but it must reach the
      # GitHub App API to validate an exact workflow run before assigning it.
      # Keep that one-way egress surface separate from the mTLS-only worker
      # network instead of weakening qdev_runner_internal.
      - qdev_runner_egress
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

  registry:
    container_name: qdev-runner-registry
    image: registry:2.8.3
    restart: unless-stopped
    environment:
      REGISTRY_HTTP_ADDR: 0.0.0.0:5000
      REGISTRY_STORAGE_DELETE_ENABLED: "true"
    volumes:
      - /var/lib/qdev-runner/registry:/var/lib/registry
    networks:
      - qdev_edge
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

networks:
  qdev_edge:
    external: true
    name: qdev_edge
  qdev_runner_internal:
    name: qdev_runner_internal
    internal: true
  qdev_runner_egress:
    name: qdev_runner_egress
